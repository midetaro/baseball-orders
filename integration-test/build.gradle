plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.0')
    testImplementation 'com.example.baseballorders.backend:infrastructure:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.backend:application:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.backend:domain:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.backend:messaging-contract:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.simulator:infrastructure:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.simulator:application:0.1.0-SNAPSHOT'
    testImplementation 'com.example.baseballorders.simulator:domain:0.1.0-SNAPSHOT'
    testImplementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:4.0.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    testImplementation 'software.amazon.awssdk:sqs:2.30.36'
    testImplementation 'io.floci:testcontainers-floci:2.16.1'
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
