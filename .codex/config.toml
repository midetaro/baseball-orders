approval_policy = "never"
default_permissions = "project-config-edit"

[permissions.project-config-edit]
description = "Allow project, .codex, .git, and Gradle cache edits."
extends = ":workspace"

[permissions.project-config-edit.filesystem]
":minimal" = "read"
"~/.gradle" = "write"

[permissions.project-config-edit.filesystem.":workspace_roots"]
"." = "write"
".codex" = "write"
".git" = "write"

[permissions.project-config-edit.network]
enabled = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4