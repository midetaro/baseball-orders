name: baseball-orders

x-aws-environment: &aws-environment
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: ap-northeast-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ENDPOINT_URL_SQS: http://floci:4566
  SIMULATION_REQUEST_QUEUE_NAME: ${SIMULATION_REQUEST_QUEUE_NAME:-simulation-request}
  SIMULATION_RESULT_QUEUE_NAME: ${SIMULATION_RESULT_QUEUE_NAME:-simulation-result}

services:
  floci:
    image: floci/floci:2.0.1
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: memory
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  queues:
    image: floci/floci:2.0.1
    entrypoint: ["/bin/sh", "/init-queues.sh"]
    environment: *aws-environment
    volumes:
      - ./infra/docker/init-queues.sh:/init-queues.sh:ro
    depends_on:
      floci:
        condition: service_healthy
    restart: "no"

  simulator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: simulator
    environment:
      <<: *aws-environment
      SIMULATION_SQS_POLL_FIXED_DELAY: 1s
      SIMULATION_GAME_COUNT: "1"
    depends_on:
      queues:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: backend
    environment:
      <<: *aws-environment
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://floci:4566
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      queues:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
