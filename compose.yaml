name: baseball-orders

services:
  simulator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: simulator
    environment:
      SIMULATION_GRPC_PORT: ${SIMULATION_GRPC_PORT:-9090}
    expose:
      - "9090"

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        APP: backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SIMULATOR_GRPC_HOST: simulator
      SIMULATOR_GRPC_PORT: ${SIMULATION_GRPC_PORT:-9090}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
