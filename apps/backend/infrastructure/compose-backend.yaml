name: baseball-orders-backend

services:
  backend:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: backend
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
