<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>打順監督</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #fffaf1;
            --muted: #bdc7d7;
            --panel: rgba(13, 20, 42, .9);
            --panel-strong: #111b39;
            --line: rgba(86, 122, 181, .42);
            --lime: #d9ff43;
            --orange: #ff7849;
            --cyan: #25d9ff;
            --pink: #ff4da6;
            --violet: #875cff;
            --amber: #ffb12b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: radial-gradient(circle at 15% 10%, rgba(37, 217, 255, .2), transparent 29%), radial-gradient(circle at 88% 18%, rgba(255, 77, 166, .2), transparent 28%), radial-gradient(circle at 52% 92%, rgba(135, 92, 255, .19), transparent 34%), #070b18;
            background-attachment: fixed;
            font-family: Inter, "Noto Sans JP", sans-serif;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            content: "";
            opacity: .22;
            background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, #000, transparent 85%);
        }

        main {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
            padding: 48px 0 64px;
        }

        header {
            position: relative;
        }

        header::before {
            display: inline-flex;
            padding: 6px 10px;
            border: 1px solid rgba(37, 217, 255, .55);
            border-radius: 999px;
            content: "BASEBALL ORDER LAB";
            color: var(--cyan);
            background: rgba(37, 217, 255, .09);
            font: 800 11px monospace;
            letter-spacing: .18em;
            box-shadow: 0 0 24px rgba(37, 217, 255, .14);
        }

        h1 {
            width: max-content;
            max-width: 100%;
            margin: 12px 0 0;
            font-size: clamp(42px, 7vw, 78px);
            line-height: .9;
            letter-spacing: -.08em;
            color: transparent;
            background: linear-gradient(110deg, var(--ink) 10%, var(--cyan) 46%, var(--lime) 78%);
            background-clip: text;
            filter: drop-shadow(0 10px 26px rgba(37, 217, 255, .17));
        }

        a {
            color: var(--cyan);
            font-weight: 700;
            text-underline-offset: 4px;
        }

        a:hover {
            color: var(--lime);
        }

        .eyebrow, .slot-index {
            color: var(--lime);
            font: 800 12px monospace;
            letter-spacing: .12em;
        }

        .status, .hint {
            color: var(--muted);
            font-size: 13px;
        }

        .simulation-workspace {
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(420px, 1.05fr);
            align-items: start;
            gap: 28px;
            margin-top: 28px;
        }

        section {
            position: relative;
            background: linear-gradient(155deg, rgba(21, 32, 66, .94), var(--panel));
            border: 1px solid var(--line);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .05);
        }

        section::before {
            position: absolute;
            top: 0;
            right: 24px;
            left: 24px;
            height: 2px;
            content: "";
            background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
            opacity: .85;
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(90deg, rgba(37, 217, 255, .08), rgba(255, 77, 166, .05));
        }

        h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: .01em;
        }

        .order-scroll {
            overflow-x: auto;
            scrollbar-color: var(--violet) transparent;
        }

        .order {
            width: max-content;
            min-width: 570px;
            padding: 0 12px 12px;
        }

        .columns, .slot {
            display: grid;
            grid-template-columns:38px repeat(4, 76px) 118px 78px 78px;
            gap: 8px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--line);
        }

        .columns {
            color: var(--cyan);
            background: rgba(37, 217, 255, .035);
            font: 700 11px monospace;
        }

        .slot {
            transition: background .2s ease;
        }

        .slot:hover {
            background: rgba(135, 92, 255, .09);
        }

        input, select {
            width: 100%;
            padding: 9px;
            color: var(--ink);
            background: rgba(5, 10, 26, .78);
            border: 1px solid rgba(117, 150, 205, .65);
            border-radius: 8px;
            outline: none;
            font: 13px monospace;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        input:hover, select:hover {
            border-color: var(--cyan);
        }

        input:focus, select:focus {
            border-color: var(--cyan);
            background: #0b1430;
            box-shadow: 0 0 0 3px rgba(37, 217, 255, .16), 0 0 20px rgba(37, 217, 255, .1);
        }

        input:disabled, select:disabled {
            cursor: not-allowed;
            opacity: .4;
        }

        input:invalid {
            border-color: var(--orange);
            box-shadow: 0 0 0 2px rgba(255, 120, 73, .12);
        }

        button {
            border: 0;
            cursor: pointer;
            font: 800 13px inherit;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .bunt-toggle {
            padding: 9px;
            border: 1px solid rgba(135, 92, 255, .45);
            border-radius: 8px;
            background: rgba(135, 92, 255, .15);
            color: var(--ink);
        }

        .bunt-toggle[aria-pressed="true"] {
            border-color: var(--orange);
            background: linear-gradient(135deg, var(--orange), #ffb12b);
            color: #281006;
            box-shadow: 0 5px 18px rgba(255, 120, 73, .23);
        }

        .lineup-workspace {
            min-width: 0;
        }

        .submit {
            padding: 10px 14px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--cyan), var(--lime));
            color: #07141a;
            box-shadow: 0 8px 24px rgba(37, 217, 255, .22);
        }

        .all-toggle {
            padding: 9px 12px;
            border: 1px solid var(--violet);
            border-radius: 8px;
            background: rgba(135, 92, 255, .12);
            color: #d7caff;
        }

        .all-toggle[aria-pressed="true"] {
            background: linear-gradient(135deg, var(--pink), var(--orange));
            border-color: transparent;
            color: #240616;
            box-shadow: 0 7px 20px rgba(255, 77, 166, .22);
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        #feedback {
            min-height: 48px;
            margin: 12px 24px 20px;
            padding: 13px;
            border: 1px solid rgba(37, 217, 255, .18);
            border-radius: 10px;
            background: rgba(5, 10, 26, .68);
            color: var(--muted);
            white-space: pre-line;
        }

        #feedback.success {
            border-color: rgba(217, 255, 67, .35);
            color: var(--lime);
        }

        #feedback.error {
            border-color: rgba(255, 120, 73, .45);
            color: #ffad91;
        }

        #results {
            min-width: 0;
        }

        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        #transitions {
            max-height: 640px;
            margin: 0;
            padding: 18px 24px;
            overflow-y: auto;
            color: var(--ink);
            font: 13px monospace;
            white-space: pre-line;
        }

        .empty-chart-state {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 980px) {
            .simulation-workspace {
                grid-template-columns:1fr;
            }
        }

        @media (max-width: 760px) {
            main {
                width: min(100% - 20px, 1180px);
                padding-top: 28px;
            }

            .section-head {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .result-head {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<main>
    <header><h1>打順監督</h1>
        <p class="status">
            打順ごとの成績を入力して1試合の推移を確認する。 <a href="/simulation-guide">シミュレーションの仕組み</a> ／ <a href="/large-scale">大規模実行はこちら</a>
            <span th:if="${#authorization.expression('isAuthenticated()')}">ログイン中（<span th:text="${#authentication.name}">ユーザー</span>）</span>
            <span th:unless="${#authorization.expression('isAuthenticated()')}">未ログイン</span>
            <a href="/login" th:if="${!#authorization.expression('isAuthenticated()')}">ログイン</a>
        </p>
        <form action="/logout" method="post" th:if="${#authorization.expression('isAuthenticated()')}">
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
            <button type="submit">ログアウト</button>
        </form>
    </header>
    <div class="simulation-workspace">
        <section aria-labelledby="order-heading">
            <div class="section-head"><h2 id="order-heading">打順入力</h2>
                <button class="submit" id="submit" type="button">1試合を実行</button>
                <button aria-pressed="false" class="all-toggle" id="toggle-all-bunt" type="button">全員バント</button>
                <button aria-pressed="false" class="all-toggle" id="toggle-all-steal" type="button">全員盗塁</button>
                <button class="all-toggle" id="reset-all-personalities" type="button">性格を初期化</button>
            </div>
            <div class="lineup-workspace">
                <div class="order-scroll">
                    <div class="order">
                        <div class="columns">
                            <span>打順</span><span>出塁率</span><span>長打率</span><span>バント成功率</span><span>盗塁成功率</span><span>性格</span><span>バント</span><span>盗塁</span>
                        </div>
                        <div id="order"></div>
                    </div>
                </div>
            </div>
            <div id="feedback" role="status">すべての成績を入力してください。</div>
        </section>
        <section aria-labelledby="results-heading" id="results">
            <div class="section-head result-head">
                <div><h2 id="results-heading">試合の推移</h2>
                    <p class="hint">1試合分のイニングごとの推移</p></div>
            </div>
            <pre id="transitions">まだ試合を実行していません。</pre>
        </section>
    </div>
</main>
<script>
    const lineup = [
      {hitAverage:'0.35',sluggish:'0.35',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'},
      {hitAverage:'0.35',sluggish:'0.35',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'},
      {hitAverage:'0.35',sluggish:'0.50',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:false,stealEnabled:false,personality:'DEFAULT'},
      {hitAverage:'0.35',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:false,stealEnabled:false,personality:'DEFAULT'},
      {hitAverage:'0.35',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:false,stealEnabled:false,personality:'DEFAULT'},
      {hitAverage:'0.33',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'},
      {hitAverage:'0.29',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'},
      {hitAverage:'0.28',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'},
      {hitAverage:'0.27',sluggish:'0.40',buntSuccessRate:'0.70',stealSuccessRate:'0.70',buntEnabled:true,stealEnabled:true,personality:'DEFAULT'}
    ];
    let inFlight = false;
    const order = document.querySelector('#order'), submit = document.querySelector('#submit'), feedback = document.querySelector('#feedback'), toggleAllBunt = document.querySelector('#toggle-all-bunt'), toggleAllSteal = document.querySelector('#toggle-all-steal'), resetAllPersonalities = document.querySelector('#reset-all-personalities'), transitions = document.querySelector('#transitions');
    const ranges = {hitAverage:[0.01,0.6], sluggish:[0.1,0.6], buntSuccessRate:[0,0.7], stealSuccessRate:[0.1,0.7]};
    function hasAtMostTwoDecimalPlaces(value) { return /^(?:\d+|\d*\.\d{1,2})$/.test(value); }
    function valid(player) { return Object.values(player).every(value => value !== '') && Object.entries(ranges).every(([key,[min,max]]) => hasAtMostTwoDecimalPlaces(player[key]) && Number(player[key]) >= min && Number(player[key]) <= max); }
    function validLineup() { return lineup.every(valid) && lineup.reduce((sum,player)=>sum+Number(player.hitAverage),0)/lineup.length<=0.35 && lineup.reduce((sum,player)=>sum+Number(player.sluggish),0)/lineup.length<=0.4; }
    const fields = [{key:'hitAverage',label:'出塁率',min:0.01,max:0.6},{key:'sluggish',label:'長打率',min:0.1,max:0.6},{key:'buntSuccessRate',label:'バント成功率',min:0,max:0.7,enabledKey:'buntEnabled'},{key:'stealSuccessRate',label:'盗塁成功率',min:0.1,max:0.7,enabledKey:'stealEnabled'}];
    function toggle(label, enabled, onClick) { const button=document.createElement('button'); button.type='button'; button.className='bunt-toggle'; button.disabled=inFlight; button.textContent=`${label}: ${enabled?'する':'しない'}`; button.setAttribute('aria-pressed',String(enabled)); button.addEventListener('click',onClick); return button; }
    function formatPercentage(value) { return value === '' || !hasAtMostTwoDecimalPlaces(value) ? value : Number(value).toFixed(2); }
    const personalityLabels = {DEFAULT:'標準',EAGER_SLUGGISH:'ブンブン丸',EAGER_STEAL:'盗塁重視',EAGER_BUNT:'バント重視'};
    function personalitySelect(player) { const select=document.createElement('select'); select.setAttribute('aria-label','性格'); select.disabled=inFlight; Object.entries(personalityLabels).forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=player.personality===value;select.append(option);}); select.addEventListener('change',()=>{player.personality=select.value;}); return select; }
    function render() { order.replaceChildren(); lineup.forEach((player,index) => { const row=document.createElement('div'); row.className='slot'; const position=document.createElement('span'); position.className='slot-index'; position.textContent=`${index+1}番`; row.append(position); fields.forEach(field => { const input=document.createElement('input'); input.type='number'; input.required=true; input.setAttribute('aria-label',field.label); input.min=String(field.min); input.max=String(field.max); input.step='0.01'; input.value=player[field.key]; input.disabled=inFlight || (field.enabledKey && !player[field.enabledKey]); input.addEventListener('input',()=>{const value=input.value.startsWith('.') ? `0${input.value}` : input.value;input.value=value;player[field.key]=value;update();}); input.addEventListener('change',()=>{const value=formatPercentage(input.value);input.value=value;player[field.key]=value;update();}); row.append(input); }); row.append(personalitySelect(player),toggle('バント',player.buntEnabled,()=>{player.buntEnabled=!player.buntEnabled; render();}),toggle('盗塁',player.stealEnabled,()=>{player.stealEnabled=!player.stealEnabled; render();})); order.append(row); }); update(); }
    function update() { const complete=validLineup(); const allBuntEnabled=lineup.every(player=>player.buntEnabled); const allStealEnabled=lineup.every(player=>player.stealEnabled); submit.disabled=inFlight || !complete; toggleAllBunt.disabled=inFlight; toggleAllBunt.setAttribute('aria-pressed',String(allBuntEnabled)); toggleAllSteal.disabled=inFlight; toggleAllSteal.setAttribute('aria-pressed',String(allStealEnabled)); resetAllPersonalities.disabled=inFlight; if (!inFlight) { feedback.className=''; feedback.textContent=complete?'準備完了。1試合を実行できます。':'出塁率の平均は0.35以下、長打率の平均は0.40以下、バント・盗塁成功率は0.70以下で小数第2位まで入力してください。'; } }
    function renderTransitions(gameTransitions) { if (!Array.isArray(gameTransitions) || gameTransitions.length === 0) { transitions.textContent='試合結果はありません。'; return; } transitions.textContent=gameTransitions.map(t=>`イニング${t.inning} ${t.actionResult} アウト${t.outCount} 得点${t.cumulativeScore} 走者:${t.runnerState}`).join('\n'); }
    toggleAllBunt.addEventListener('click',()=>{const enabled=!lineup.every(player=>player.buntEnabled);lineup.forEach(player=>{player.buntEnabled=enabled;});render();});
    toggleAllSteal.addEventListener('click',()=>{const enabled=!lineup.every(player=>player.stealEnabled);lineup.forEach(player=>{player.stealEnabled=enabled;});render();});
    resetAllPersonalities.addEventListener('click',()=>{lineup.forEach(player=>{player.personality='DEFAULT';});render();});
    submit.addEventListener('click',async()=>{if(inFlight||!validLineup())return; inFlight=true;render();feedback.className='';feedback.textContent='試合を実行中…';try {const response=await fetch('/simulations/single-game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lineup.map(player=>({hit_average:Number(player.hitAverage),sluggish:Number(player.sluggish),bunt_success_rate:Number(player.buntSuccessRate),steal_success_rate:Number(player.stealSuccessRate),bunt_enabled:player.buntEnabled,steal_enabled:player.stealEnabled,personality:player.personality})))});const data=await response.json();if(!response.ok)throw new Error(data.error||data.message||'リクエストに失敗しました。');renderTransitions(data.transitions);feedback.className='success';feedback.textContent='試合が終了しました。';}catch(error){feedback.className='error';feedback.textContent=error.message;}finally{inFlight=false;render();}});
    render();
</script>
</body>
</html>
