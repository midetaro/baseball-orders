<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>打順監督</title>
    <link rel="stylesheet" href="/css/single-game.css">
    <link rel="stylesheet" href="/css/site-menu.css">
</head>
<body>
<th:block th:replace="~{fragments/site-menu :: siteMenu('/single-game')}"></th:block>
<main>
    <header>
        <button th:replace="~{fragments/site-menu :: menuToggle}"></button>
        <h1>打順監督</h1>
        <p class="status">
            打順ごとの成績を入力して1試合の推移を確認する。
        </p>
    </header>
    <nav aria-label="画面切り替え" class="view-tabs" role="tablist">
        <button aria-controls="input-view" aria-selected="true" class="view-tab" id="tab-input" role="tab" type="button"><span class="view-tab-step">1</span>打順入力</button>
        <button aria-controls="results" aria-selected="false" class="view-tab" disabled id="tab-results" role="tab" type="button"><span class="view-tab-step">2</span>試合結果</button>
    </nav>
    <div class="simulation-workspace">
        <section aria-labelledby="order-heading" id="input-view" role="tabpanel">
            <div class="section-head"><h2 id="order-heading">打順入力</h2>
                <button class="submit" id="submit" type="button">1試合を実行</button>
                <span class="average-hit-average"><span class="average-caption">平均打率</span> <span id="average-hit-average">—</span></span>
                <div class="section-actions">
                    <button aria-pressed="false" class="all-toggle" id="toggle-all-bunt" type="button">全員バント</button>
                    <button aria-pressed="false" class="all-toggle" id="toggle-all-steal" type="button">全員盗塁</button>
                    <button class="all-toggle" id="reset-all-personalities" type="button">性格を初期化</button>
                </div>
            </div>
            <div class="lineup-workspace">
                <div class="order-scroll">
                    <div class="order">
                        <div class="columns">
                            <span>打順</span><span>打率</span><span>性格</span><span>バント</span><span>盗塁</span>
                        </div>
                        <div id="order"></div>
                    </div>
                </div>
            </div>
            <div id="feedback" role="status">すべての成績を入力してください。</div>
        </section>
        <section aria-labelledby="results-heading" hidden id="results" role="tabpanel">
            <div class="section-head result-head">
                <div><h2 id="results-heading">試合結果</h2>
                    <p class="hint" id="result-feedback" role="status">1試合分のイニングごとの推移をアニメーションで再生する</p></div>
                <div class="result-actions">
                    <button class="all-toggle" id="edit-lineup" type="button">打順を編集する</button>
                </div>
            </div>
            <div class="line-score-wrap" id="line-score">
                <p class="empty-chart-state">まだ試合を実行していません。</p>
            </div>
            <div class="playback-panel">
            <div aria-label="再生速度" class="playback-speed" role="group">
                <span class="playback-speed-label">再生速度</span>
                <button aria-pressed="false" class="speed-option" data-speed="slow" type="button">遅い</button>
                <button aria-pressed="true" class="speed-option" data-speed="normal" type="button">普通</button>
                <button aria-pressed="false" class="speed-option" data-speed="fast" type="button">速い</button>
            </div>
            <div class="frame-stage" id="frame-stage" th:attr="data-frame-duration-millis=${frameDurationMillis},data-hit-frame-duration-millis=${hitFrameDurationMillis},data-score-frame-duration-millis=${scoreFrameDurationMillis},data-home-run-frame-duration-millis=${homeRunFrameDurationMillis},data-bunt-frame-duration-millis=${buntFrameDurationMillis}">
                <p class="empty-chart-state" id="frame-placeholder">まだ試合を実行していません。</p>
            </div>
            </div>
            <div class="order-table-wrap">
                <h3 class="order-table-heading">打順成績表</h3>
                <div class="order-table-scroll" id="order-table-scroll">
                    <p class="empty-chart-state" id="order-table-placeholder">まだ試合を実行していません。</p>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="/js/lineup-form.js"></script>
<script src="/js/single-game.js"></script>
<script src="/js/site-menu.js"></script>
</body>
</html>
