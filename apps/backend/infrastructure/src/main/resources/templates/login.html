<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>ログイン</title></head><body><h1>ログイン</h1><p th:if="${param.error}">ユーザー名またはパスワードが正しくありません。</p><p th:if="${param.registered}">アカウントを作成しました。ログインしてください。</p><p th:if="${param.logout}">ログアウトしました。</p><form th:action="@{/login}" method="post"><label>ユーザー名 <input name="username" required autocomplete="username"></label><label>パスワード <input type="password" name="password" required autocomplete="current-password"></label><button type="submit">ログイン</button></form><p><a th:href="@{/users/new}">アカウントを作成する</a></p></body></html>
