<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ログイン | 打順監督</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { align-items:center; background:#0b1020; color:#edf4ff; display:flex; justify-content:center; margin:0; min-height:100vh; }
        main { background:#151d35; border:1px solid #31446f; border-radius:16px; box-shadow:0 18px 55px #0008; max-width:420px; padding:40px; text-align:center; }
        h1 { margin-top:0; }
        p { color:#c7d4ee; line-height:1.7; }
        .login-button { background:#fff; border-radius:8px; color:#1f1f1f; display:inline-block; font-weight:700; margin:12px 0; padding:12px 24px; text-decoration:none; }
        .notice { background:#202b49; border-radius:8px; padding:12px; }
        .back { color:#7edcff; display:inline-block; margin-top:16px; }
    </style>
</head>
<body>
<main>
    <h1>打順監督にログイン</h1>
    <p>Googleアカウントでログインすると、ログイン状態を維持したままサービスを利用できます。</p>
    <a class="login-button" href="/oauth2/authorization/google" th:if="${googleOauthEnabled}">Googleでログイン</a>
    <p class="notice" th:unless="${googleOauthEnabled}">Googleログインは現在利用できません。</p>
    <a class="back" href="/">トップへ戻る</a>
</main>
</body>
</html>
