<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 全画面共通の左メニュー。画面遷移はこのメニューからだけ行い、既定では閉じておく。current には表示中の画面のルートを渡す。 -->
<th:block th:fragment="siteMenu(current)">
<nav aria-label="画面メニュー" class="site-menu" hidden id="site-menu">
    <div class="site-menu-head"><span class="site-menu-title">メニュー</span>
        <button aria-label="メニューを閉じる" class="menu-close" id="menu-close" type="button">閉じる</button>
    </div>
    <ul>
        <li><a href="/" th:attr="aria-current=${current == '/'} ? 'page'">打順組み替え</a></li>
        <li><a href="/large-scale" th:attr="aria-current=${current == '/large-scale'} ? 'page'">大規模実行</a></li>
        <li><a href="/single-game" th:attr="aria-current=${current == '/single-game'} ? 'page'">1試合実行</a></li>
        <li><a href="/simulation-guide" th:attr="aria-current=${current == '/simulation-guide'} ? 'page'">シミュレーションの仕組み</a></li>
    </ul>
</nav>
<div class="menu-backdrop" hidden id="menu-backdrop"></div>
</th:block>
<button aria-controls="site-menu" aria-expanded="false" class="menu-toggle" id="menu-toggle" th:fragment="menuToggle" type="button"><span aria-hidden="true" class="menu-icon"></span>メニュー</button>
</body>
</html>
