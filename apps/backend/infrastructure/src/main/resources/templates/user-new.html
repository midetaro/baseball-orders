<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>アカウント作成</title></head><body><h1>アカウント作成</h1><p>ユーザー名には個人名やメールアドレスを入力しないでください。</p><p th:if="${param.error}">入力内容を確認するか、別のユーザー名を使用してください。</p><form th:action="@{/users}" method="post"><label>ユーザー名 <input name="username" required pattern="[A-Za-z0-9_-]{3,50}" autocomplete="username"></label><label>パスワード <input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><button type="submit">作成する</button></form><p><a th:href="@{/login}">ログインへ戻る</a></p></body></html>
