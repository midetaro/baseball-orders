<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batting Order Lab</title>
  <style>
    :root { color-scheme:dark; --ink:#f7f3e8; --muted:#a8b0ad; --panel:#17201f; --line:#31423e; --lime:#d8ff62; --orange:#ff8d5c; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:#0c1212; font-family:Inter,"Noto Sans JP",sans-serif; }
    main { width:min(1180px,calc(100% - 32px)); margin:auto; padding:48px 0 64px; } h1 { margin:10px 0 0; font-size:clamp(36px,6vw,72px); line-height:.9; }
    .eyebrow,.slot-index { color:var(--lime); font:700 12px monospace; letter-spacing:.12em; } .status,.hint { color:var(--muted); font-size:13px; }
    section { margin-top:28px; background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; } .section-head,.actions { padding:20px 24px; border-bottom:1px solid var(--line); }
    h2 { margin:0; font-size:18px; } .order-scroll { overflow-x:auto; } .order { min-width:640px; padding:0 12px 12px; }
    .columns,.slot { display:grid; grid-template-columns:38px repeat(4,minmax(72px,1fr)) 78px 78px; gap:8px; align-items:center; padding:8px; border-bottom:1px solid var(--line); }
    .columns { color:var(--muted); font-size:11px; } label { display:grid; gap:5px; color:var(--muted); font-size:11px; } input { width:100%; padding:9px; color:var(--ink); background:#101817; border:1px solid #526a64; border-radius:7px; font:13px monospace; }
    input:invalid { border-color:var(--orange); } button { border:0; cursor:pointer; font:700 13px inherit; } .bunt-toggle { padding:9px; border-radius:7px; background:#263431; color:var(--ink); } .bunt-toggle[aria-pressed="true"] { background:var(--orange); color:#25120c; }
    .actions { border-bottom:0; } .submit { width:100%; padding:16px; border-radius:10px; background:var(--lime); color:#17200f; } button:disabled { opacity:.35; cursor:not-allowed; }
    #feedback { min-height:48px; margin-top:12px; padding:13px; border-radius:10px; background:#101817; color:var(--muted); white-space:pre-line; } #feedback.success { color:var(--lime); } #feedback.error { color:#ff9a87; }
    #results { margin-top:22px; } .result-head { display:flex; align-items:center; justify-content:space-between; gap:16px; } .share { padding:9px 12px; border:1px solid var(--lime); border-radius:7px; background:transparent; color:var(--lime); } .statistics-groups { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); } .statistics-group { background:var(--panel); } .statistics-group h3 { margin:0; padding:14px 18px; color:var(--muted); font-size:12px; } .statistics { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); } .statistics.two-columns { grid-template-columns:repeat(2,1fr); } .statistic { padding:18px; border-right:1px solid var(--line); } .statistic:last-child { border-right:0; } .statistic-label { color:var(--muted); font-size:11px; } .statistic-value { margin-top:6px; font:700 26px monospace; color:var(--lime); }
    .results-table { width:100%; border-collapse:collapse; } .results-table th,.results-table td { padding:12px 24px; text-align:right; border-bottom:1px solid var(--line); } .results-table th:first-child,.results-table td:first-child { text-align:left; }
    @media (max-width:760px) { main { width:min(100% - 20px,1180px); padding-top:28px; } .result-head { align-items:flex-start; flex-direction:column; } .statistics-groups { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">Baseball Orders / Simulator</div><h1>LINEUP<br>BUILDER</h1><p class="status">打順ごとの成績を入力する。 <a href="/simulation-guide">シミュレーションの仕組み</a></p></header>
  <section aria-labelledby="order-heading">
    <div class="section-head"><h2 id="order-heading">打順入力</h2><p class="hint">名前は入力せず、一番〜九番として送信します。</p></div>
    <div class="order-scroll"><div class="order"><div class="columns"><span>打順</span><span>打率</span><span>長打率</span><span>バント成功率</span><span>盗塁成功率</span><span>バント</span><span>盗塁</span></div><div id="order"></div></div></div>
    <div class="actions"><button class="submit" id="submit" type="button">SIMULATIONを実行</button><div id="feedback" role="status">すべての成績を入力してください。</div></div>
  </section>
  <section id="results" aria-labelledby="results-heading" hidden>
    <div class="section-head result-head"><div><h2 id="results-heading">試合結果</h2><p class="hint">あなたの打線のシミュレーション結果</p></div><button class="share" id="share-results" type="button">結果を共有</button></div>
    <div class="statistics-groups">
      <div class="statistics-group"><h3>得点サマリー</h3><div class="statistics"><div class="statistic"><div class="statistic-label">平均得点</div><div class="statistic-value" id="average-score"></div></div><div class="statistic"><div class="statistic-label">中央値得点</div><div class="statistic-value" id="median-score"></div></div><div class="statistic"><div class="statistic-label">最大得点</div><div class="statistic-value" id="maximum-score"></div></div></div></div>
      <div class="statistics-group"><h3>本塁打の内訳</h3><div class="statistics"><div class="statistic"><div class="statistic-label">本塁打</div><div class="statistic-value" id="home-run-count"></div></div><div class="statistic"><div class="statistic-label">ソロ</div><div class="statistic-value" id="solo-home-run-count"></div></div><div class="statistic"><div class="statistic-label">ツーラン</div><div class="statistic-value" id="two-run-home-run-count"></div></div></div><div class="statistics two-columns"><div class="statistic"><div class="statistic-label">スリーラン</div><div class="statistic-value" id="three-run-home-run-count"></div></div><div class="statistic"><div class="statistic-label">満塁</div><div class="statistic-value" id="grand-slam-count"></div></div></div></div>
      <div class="statistics-group"><h3>戦術の成功数</h3><div class="statistics two-columns"><div class="statistic"><div class="statistic-label">成功バント</div><div class="statistic-value" id="bunt-count"></div></div><div class="statistic"><div class="statistic-label">成功盗塁</div><div class="statistic-value" id="steal-count"></div></div></div></div>
    </div>
    <table class="results-table"><thead><tr><th scope="col">試合</th><th scope="col">得点</th><th scope="col">失点</th></tr></thead><tbody id="result-rows"></tbody></table>
  </section>
</main>
<script>
  const lineup = [
    {hitAverage:'.270',sluggish:'.350',buntSuccessRate:'.700',stealSuccessRate:'.800',buntEnabled:true,stealEnabled:true},
    {hitAverage:'.270',sluggish:'.350',buntSuccessRate:'.700',stealSuccessRate:'.800',buntEnabled:true,stealEnabled:true},
    {hitAverage:'.320',sluggish:'.500',buntSuccessRate:'.700',stealSuccessRate:'.500',buntEnabled:false,stealEnabled:false},
    {hitAverage:'.320',sluggish:'.500',buntSuccessRate:'.700',stealSuccessRate:'.500',buntEnabled:false,stealEnabled:false},
    {hitAverage:'.320',sluggish:'.500',buntSuccessRate:'.700',stealSuccessRate:'.500',buntEnabled:false,stealEnabled:false},
    {hitAverage:'.230',sluggish:'.400',buntSuccessRate:'.700',stealSuccessRate:'.650',buntEnabled:true,stealEnabled:true},
    {hitAverage:'.230',sluggish:'.400',buntSuccessRate:'.700',stealSuccessRate:'.650',buntEnabled:true,stealEnabled:true},
    {hitAverage:'.230',sluggish:'.400',buntSuccessRate:'.700',stealSuccessRate:'.650',buntEnabled:true,stealEnabled:true},
    {hitAverage:'.230',sluggish:'.400',buntSuccessRate:'.700',stealSuccessRate:'.650',buntEnabled:true,stealEnabled:true}
  ];
  let inFlight = false;
  const order = document.querySelector('#order'), submit = document.querySelector('#submit'), feedback = document.querySelector('#feedback'), results = document.querySelector('#results'), resultRows = document.querySelector('#result-rows'), shareResults = document.querySelector('#share-results');
  const ranges = {hitAverage:[0.005,0.4], sluggish:[0.1,0.6], stealSuccessRate:[0.1,0.9]};
  function valid(player) { return Object.values(player).every(value => value !== '') && Object.entries(ranges).every(([key,[min,max]]) => Number(player[key]) >= min && Number(player[key]) <= max); }
  const fields = [{key:'hitAverage',label:'打率',min:0.005,max:0.4},{key:'sluggish',label:'長打率',min:0.1,max:0.6},{key:'buntSuccessRate',label:'バント成功率',min:0,max:1},{key:'stealSuccessRate',label:'盗塁成功率',min:0.1,max:0.9}];
  function toggle(label, enabled, onClick) { const button=document.createElement('button'); button.type='button'; button.className='bunt-toggle'; button.disabled=inFlight; button.textContent=`${label}: ${enabled?'する':'しない'}`; button.setAttribute('aria-pressed',String(enabled)); button.addEventListener('click',onClick); return button; }
  function render() { order.replaceChildren(); lineup.forEach((player,index) => { const row=document.createElement('div'); row.className='slot'; const position=document.createElement('span'); position.className='slot-index'; position.textContent=`${index+1}番`; row.append(position); fields.forEach(field => { const labelElement=document.createElement('label'); labelElement.textContent=field.label; const input=document.createElement('input'); input.type='number'; input.required=true; input.min=String(field.min); input.max=String(field.max); input.step='0.001'; input.value=player[field.key]; input.disabled=inFlight; input.addEventListener('input',()=>{player[field.key]=input.value; update();}); labelElement.append(input); row.append(labelElement); }); row.append(toggle('バント',player.buntEnabled,()=>{player.buntEnabled=!player.buntEnabled; render();}),toggle('盗塁',player.stealEnabled,()=>{player.stealEnabled=!player.stealEnabled; render();})); order.append(row); }); update(); }
  function update() { const complete=lineup.every(valid); submit.disabled=inFlight || !complete; if (!inFlight) { feedback.className=''; feedback.textContent=complete?'準備完了。シミュレーションを実行できます。':'打率 0.005〜0.400、長打率 0.100〜0.600、盗塁成功率 0.100〜0.900で入力してください。'; } }
  function renderResults(games, statistics) { ['averageScore','medianScore','maximumScore','homeRunCount','soloHomeRunCount','twoRunHomeRunCount','threeRunHomeRunCount','grandSlamCount','buntCount','stealCount'].forEach(key=>{const id=key.replace(/[A-Z]/g,letter=>`-${letter.toLowerCase()}`); document.querySelector(`#${id}`).textContent=String(statistics[key] ?? 0);}); games.forEach((game,index)=>{const row=document.createElement('tr'); [index+1,game.score,game.runs].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);row.append(cell);});resultRows.append(row);}); results.hidden=games.length===0; feedback.className='success';feedback.textContent=games.length===0?'試合結果はありません。':`試合終了：${games.length}試合`; }
  function shareText() { return `LINEUP BUILDERの結果\\n平均得点: ${document.querySelector('#average-score').textContent}\\n中央値得点: ${document.querySelector('#median-score').textContent}\\n最大得点: ${document.querySelector('#maximum-score').textContent}`; }
  shareResults.addEventListener('click',async()=>{const text=shareText();try {if (navigator.share) { await navigator.share({title:'LINEUP BUILDERの結果',text}); feedback.className='success';feedback.textContent='結果を共有しました。'; } else { await navigator.clipboard.writeText(text); feedback.className='success';feedback.textContent='共有用テキストをコピーしました。'; }} catch (error) { if (error.name !== 'AbortError') { feedback.className='error';feedback.textContent='共有できませんでした。'; } }});
  submit.addEventListener('click',async()=>{if(inFlight||!lineup.every(valid))return; inFlight=true;render();resultRows.replaceChildren();results.hidden=true;feedback.textContent='シミュレーション中…';try {const response=await fetch('/simulations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lineup.map(player=>({hit_average:Number(player.hitAverage),sluggish:Number(player.sluggish),bunt_success_rate:Number(player.buntSuccessRate),steal_success_rate:Number(player.stealSuccessRate),bunt_enabled:player.buntEnabled,steal_enabled:player.stealEnabled})))});const data=await response.json();if(!response.ok)throw new Error(data.error||data.message||'リクエストに失敗しました。');renderResults(data.results,data.statistics);}catch(error){feedback.className='error';feedback.textContent=error.message;}finally{inFlight=false;render();}});
  render();
</script>
</body>
</html>
