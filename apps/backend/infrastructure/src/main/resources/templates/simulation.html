<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打順監督</title>
  <style>
    :root { color-scheme:dark; --ink:#f7f3e8; --muted:#a8b0ad; --panel:#17201f; --line:#31423e; --lime:#d8ff62; --orange:#ff8d5c; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:#0c1212; font-family:Inter,"Noto Sans JP",sans-serif; }
    main { width:min(1180px,calc(100% - 32px)); margin:auto; padding:48px 0 64px; } h1 { margin:10px 0 0; font-size:clamp(36px,6vw,72px); line-height:.9; }
    .eyebrow,.slot-index { color:var(--lime); font:700 12px monospace; letter-spacing:.12em; } .status,.hint { color:var(--muted); font-size:13px; }
    .simulation-workspace { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr); align-items:start; gap:28px; margin-top:28px; } section { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; } .section-head { display:flex; align-items:center; gap:8px; padding:20px 24px; border-bottom:1px solid var(--line); }
    h2 { margin:0; font-size:18px; } .order-scroll { overflow-x:auto; } .order { width:max-content; min-width:570px; padding:0 12px 12px; }
    .columns,.slot { display:grid; grid-template-columns:38px repeat(4,76px) 78px 78px; gap:8px; align-items:center; padding:8px; border-bottom:1px solid var(--line); }
    .columns { color:var(--muted); font-size:11px; } input { width:100%; padding:9px; color:var(--ink); background:#101817; border:1px solid #526a64; border-radius:7px; font:13px monospace; } input:disabled { cursor:not-allowed; opacity:.45; }
    input:invalid { border-color:var(--orange); } button { border:0; cursor:pointer; font:700 13px inherit; } .bunt-toggle { padding:9px; border-radius:7px; background:#263431; color:var(--ink); } .bunt-toggle[aria-pressed="true"] { background:var(--orange); color:#25120c; }
    .lineup-workspace { min-width:0; } .submit { padding:9px 12px; border-radius:7px; background:var(--lime); color:#17200f; } .all-toggle { padding:9px 12px; border:1px solid var(--lime); border-radius:7px; background:transparent; color:var(--lime); } .all-toggle[aria-pressed="true"] { background:var(--orange); border-color:var(--orange); color:#25120c; } button:disabled { opacity:.35; cursor:not-allowed; }
    #feedback { min-height:48px; margin:12px 24px 20px; padding:13px; border-radius:10px; background:#101817; color:var(--muted); white-space:pre-line; } #feedback.success { color:var(--lime); } #feedback.error { color:#ff9a87; }
    #results { min-width:0; } .result-head { display:flex; align-items:center; justify-content:space-between; gap:16px; } .share { padding:9px 12px; border:1px solid var(--lime); border-radius:7px; background:transparent; color:var(--lime); } .statistics-groups { display:grid; grid-template-columns:1fr; gap:1px; background:var(--line); } .statistics-group { min-width:0; background:var(--panel); } .statistics-group h3 { margin:0; padding:14px 18px; color:var(--muted); font-size:12px; } .statistics { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); } .statistics.two-columns { grid-template-columns:repeat(2,1fr); } .statistic { padding:18px; border-right:1px solid var(--line); } .statistic:last-child { border-right:0; } .statistic-label { color:var(--muted); font-size:11px; } .statistic-value { margin-top:6px; font:700 26px monospace; color:var(--lime); }
    .chart { padding:18px; border-top:1px solid var(--line); } .histogram { display:grid; grid-template-columns:48px minmax(0,1fr); min-height:190px; } .histogram-y-axis { display:flex; flex-direction:column; justify-content:space-between; padding:0 8px 26px 0; color:var(--muted); font:11px monospace; text-align:right; } .histogram-bars { --histogram-grid-step:25%; display:flex; align-items:end; gap:5px; height:170px; min-width:0; border-bottom:1px solid var(--line); border-left:1px solid var(--line); background:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--histogram-grid-step) - 1px),#31423e calc(var(--histogram-grid-step) - 1px),#31423e var(--histogram-grid-step)); } .histogram-bar { display:grid; flex:1 1 0; grid-template-rows:1fr auto; min-width:22px; height:196px; text-align:center; font:12px monospace; } .histogram-bar div { align-self:end; min-height:0; background:var(--lime); } .histogram-bar span { margin-top:6px; color:var(--muted); } .stacked-bar { display:flex; height:44px; border-radius:7px; overflow:hidden; background:#101817; } .stacked-bar div { min-width:0; } .solo { background:#d8ff62; } .two-run { background:#8dd6ff; } .three-run { background:#ffb86b; } .grand-slam { background:#ff8d5c; } .home-run-legend { display:flex; flex-wrap:wrap; gap:8px 12px; margin:12px 0 0; padding:0; list-style:none; color:var(--muted); font:11px monospace; } .home-run-legend li { display:flex; align-items:center; gap:5px; } .legend-swatch { width:10px; height:10px; border-radius:2px; } .empty-chart-state { margin:12px 0 0; color:var(--muted); font-size:12px; } .comparison { display:grid; gap:14px; } .comparison-row { display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:8px; align-items:center; color:var(--muted); font-size:12px; } .comparison-meter { height:12px; overflow:hidden; border-radius:4px; background:#101817; } .comparison-bar { height:100%; border-radius:4px; background:var(--lime); } .comparison-value { color:var(--lime); font:700 11px monospace; white-space:nowrap; }
    @media (max-width:980px) { .simulation-workspace { grid-template-columns:1fr; } } @media (max-width:760px) { main { width:min(100% - 20px,1180px); padding-top:28px; } .section-head { align-items:flex-start; flex-wrap:wrap; } .result-head { align-items:flex-start; flex-direction:column; } .statistics { grid-template-columns:repeat(2,1fr); } .histogram { grid-template-columns:42px minmax(0,1fr); } .histogram-bar { min-width:16px; font-size:10px; } .comparison-row { grid-template-columns:68px minmax(0,1fr); } .comparison-value { grid-column:2; } }
  </style>
</head>
<body>
<main>
  <header><h1>打順監督</h1><p class="status">打順ごとの成績を入力する。 <a href="/simulation-guide">シミュレーションの仕組み</a></p></header>
  <div class="simulation-workspace">
  <section aria-labelledby="order-heading">
    <div class="section-head"><h2 id="order-heading">打順入力</h2><button class="submit" id="submit" type="button">SIMULATIONを実行</button><button class="all-toggle" id="toggle-all-bunt" type="button" aria-pressed="false">全員バント</button><button class="all-toggle" id="toggle-all-steal" type="button" aria-pressed="false">全員盗塁</button></div>
    <div class="lineup-workspace"><div class="order-scroll"><div class="order"><div class="columns"><span>打順</span><span>出塁率</span><span>長打率</span><span>バント成功率</span><span>盗塁成功率</span><span>バント</span><span>盗塁</span></div><div id="order"></div></div></div></div>
    <div id="feedback" role="status">すべての成績を入力してください。</div>
  </section>
  <section id="results" aria-labelledby="results-heading">
    <div class="section-head result-head"><div><h2 id="results-heading">試合結果</h2><p class="hint">あなたの打線のシミュレーション結果</p></div><button class="share" id="share-results" type="button">結果を共有</button></div>
    <div class="statistics-groups">
      <div class="statistics-group"><h3>得点サマリー</h3><div class="statistics"><div class="statistic"><div class="statistic-label">試合数</div><div class="statistic-value" id="game-count"></div></div><div class="statistic"><div class="statistic-label">平均得点</div><div class="statistic-value" id="average-score"></div></div><div class="statistic"><div class="statistic-label">中央値得点</div><div class="statistic-value" id="median-score"></div></div></div><div class="statistics"><div class="statistic"><div class="statistic-label">最大得点</div><div class="statistic-value" id="maximum-score"></div></div></div><div class="chart"><div class="histogram" id="score-histogram" aria-label="得点分布ヒストグラム"><div class="histogram-y-axis" id="score-distribution-axis" aria-label="全試合に対する割合"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div><div class="histogram-bars" id="score-histogram-bars"></div></div></div></div>
      <div class="statistics-group"><h3>本塁打の内訳</h3><div class="statistics"><div class="statistic"><div class="statistic-label">本塁打</div><div class="statistic-value" id="home-run-count"></div></div></div><div class="chart"><div class="stacked-bar" id="home-run-breakdown" aria-label="本塁打内訳"></div><ul class="home-run-legend" id="home-run-legend" aria-label="本塁打内訳の凡例"></ul><p class="empty-chart-state" id="home-run-empty-state">本塁打なし</p></div></div>
      <div class="statistics-group"><h3>戦術の成否</h3><div class="chart"><div class="comparison" id="tactics-comparison" aria-label="バントと盗塁の成否比較"></div></div></div>
    </div>
  </section>
  </div>
</main>
<script>
  const lineup = [
    {hitAverage:'0.32',sluggish:'0.35',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true},
    {hitAverage:'0.32',sluggish:'0.35',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true},
    {hitAverage:'0.37',sluggish:'0.50',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:false,stealEnabled:false},
    {hitAverage:'0.37',sluggish:'0.50',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:false,stealEnabled:false},
    {hitAverage:'0.37',sluggish:'0.50',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:false,stealEnabled:false},
    {hitAverage:'0.28',sluggish:'0.40',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true},
    {hitAverage:'0.28',sluggish:'0.40',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true},
    {hitAverage:'0.28',sluggish:'0.40',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true},
    {hitAverage:'0.28',sluggish:'0.40',buntSuccessRate:'0.80',stealSuccessRate:'0.80',buntEnabled:true,stealEnabled:true}
  ];
  let inFlight = false;
  const order = document.querySelector('#order'), submit = document.querySelector('#submit'), feedback = document.querySelector('#feedback'), results = document.querySelector('#results'), shareResults = document.querySelector('#share-results'), toggleAllBunt = document.querySelector('#toggle-all-bunt'), toggleAllSteal = document.querySelector('#toggle-all-steal');
  const ranges = {hitAverage:[0.01,0.6], sluggish:[0.1,0.6], buntSuccessRate:[0,1], stealSuccessRate:[0.1,0.9]};
  function hasAtMostTwoDecimalPlaces(value) { return /^(?:\d+|\d*\.\d{1,2})$/.test(value); }
  function valid(player) { return Object.values(player).every(value => value !== '') && Object.entries(ranges).every(([key,[min,max]]) => hasAtMostTwoDecimalPlaces(player[key]) && Number(player[key]) >= min && Number(player[key]) <= max); }
  const fields = [{key:'hitAverage',label:'出塁率',min:0.01,max:0.6},{key:'sluggish',label:'長打率',min:0.1,max:0.6},{key:'buntSuccessRate',label:'バント成功率',min:0,max:1,enabledKey:'buntEnabled'},{key:'stealSuccessRate',label:'盗塁成功率',min:0.1,max:0.9,enabledKey:'stealEnabled'}];
  function toggle(label, enabled, onClick) { const button=document.createElement('button'); button.type='button'; button.className='bunt-toggle'; button.disabled=inFlight; button.textContent=`${label}: ${enabled?'する':'しない'}`; button.setAttribute('aria-pressed',String(enabled)); button.addEventListener('click',onClick); return button; }
  function formatPercentage(value) { return value === '' || !hasAtMostTwoDecimalPlaces(value) ? value : Number(value).toFixed(2); }
  function render() { order.replaceChildren(); lineup.forEach((player,index) => { const row=document.createElement('div'); row.className='slot'; const position=document.createElement('span'); position.className='slot-index'; position.textContent=`${index+1}番`; row.append(position); fields.forEach(field => { const input=document.createElement('input'); input.type='number'; input.required=true; input.setAttribute('aria-label',field.label); input.min=String(field.min); input.max=String(field.max); input.step='0.01'; input.value=player[field.key]; input.disabled=inFlight || (field.enabledKey && !player[field.enabledKey]); input.addEventListener('input',()=>{const value=input.value.startsWith('.') ? `0${input.value}` : input.value;input.value=value;player[field.key]=value;update();}); input.addEventListener('change',()=>{const value=formatPercentage(input.value);input.value=value;player[field.key]=value;update();}); row.append(input); }); row.append(toggle('バント',player.buntEnabled,()=>{player.buntEnabled=!player.buntEnabled; render();}),toggle('盗塁',player.stealEnabled,()=>{player.stealEnabled=!player.stealEnabled; render();})); order.append(row); }); update(); }
  function update() { const complete=lineup.every(valid); const allBuntEnabled=lineup.every(player=>player.buntEnabled); const allStealEnabled=lineup.every(player=>player.stealEnabled); submit.disabled=inFlight || !complete; toggleAllBunt.disabled=inFlight; toggleAllBunt.setAttribute('aria-pressed',String(allBuntEnabled)); toggleAllSteal.disabled=inFlight; toggleAllSteal.setAttribute('aria-pressed',String(allStealEnabled)); if (!inFlight) { feedback.className=''; feedback.textContent=complete?'準備完了。シミュレーションを実行できます。':'出塁率 0.01〜0.60、長打率 0.10〜0.60、盗塁成功率 0.10〜0.90を小数第2位までで入力してください。'; } }
  function renderResults(statistics) { ['gameCount','averageScore','medianScore','maximumScore','homeRunCount'].forEach(key=>{const id=key.replace(/[A-Z]/g,letter=>`-${letter.toLowerCase()}`); document.querySelector(`#${id}`).textContent=String(statistics[key] ?? 0);}); const gameCount=Number(statistics.gameCount)||0; const distribution=Object.entries(statistics.scoreDistribution ?? {}).sort(([left],[right])=>Number(left)-Number(right)); const rates=distribution.map(([,count])=>gameCount===0?0:Number(count)/gameCount*100); const maximumRate=Math.max(...rates,0); const histogramMaximum=Math.max(25,Math.ceil(maximumRate / 25) * 25); const histogram=document.querySelector('#score-histogram-bars'); const axis=document.querySelector('#score-distribution-axis'); histogram.style.setProperty('--histogram-grid-step',`${25 / histogramMaximum * 100}%`); axis.replaceChildren(...Array.from({length:histogramMaximum / 25 + 1},(_,index)=>{const rate=histogramMaximum - index * 25;const label=document.createElement('span');label.textContent=`${rate}%`;return label;}));histogram.replaceChildren(...distribution.map(([score,count],index)=>{const rate=rates[index];const bar=document.createElement('div');bar.className='histogram-bar';bar.setAttribute('aria-label',`${score}点: ${rate.toFixed(1)}%`);const column=document.createElement('div');column.style.height=`${rate / histogramMaximum * 100}%`;const label=document.createElement('span');label.textContent=`${score}点`;bar.append(column,label);return bar;})); const homeRuns=Array.of(Array.of('ソロ',statistics.soloHomeRunCount,'solo'),Array.of('ツーラン',statistics.twoRunHomeRunCount,'two-run'),Array.of('スリーラン',statistics.threeRunHomeRunCount,'three-run'),Array.of('満塁',statistics.grandSlamCount,'grand-slam')); const total=Number(statistics.homeRunCount)||0; const visibleHomeRuns=homeRuns.filter(([,count])=>Number(count)>0); const breakdown=document.querySelector('#home-run-breakdown');const legend=document.querySelector('#home-run-legend');breakdown.replaceChildren(...visibleHomeRuns.map(([label,count,kind])=>{const rate=Number(count)/total*100;const segment=document.createElement('div');segment.className=kind;segment.style.width=`${rate}%`;segment.setAttribute('aria-label',`${label}: ${rate.toFixed(1)}%`);return segment;}));legend.replaceChildren(...visibleHomeRuns.map(([label,count,kind])=>{const rate=Number(count)/total*100;const item=document.createElement('li');const swatch=document.createElement('span');swatch.className=`legend-swatch ${kind}`;const text=document.createElement('span');text.textContent=`${label} ${rate.toFixed(1)}%`;item.append(swatch,text);return item;}));document.querySelector('#home-run-empty-state').hidden=total!==0; const tactics=Array.of(Array.of('成功バント',statistics.buntCount),Array.of('失敗バント',statistics.buntFailureCount),Array.of('成功盗塁',statistics.stealCount),Array.of('失敗盗塁',statistics.stealFailureCount)); const tacticMaximum=Math.max(...tactics.map(([,count])=>Number(count)||0),1);document.querySelector('#tactics-comparison').replaceChildren(...tactics.map(([label,count])=>{const numericCount=Number(count)||0;const row=document.createElement('div');row.className='comparison-row';const name=document.createElement('span');name.textContent=label;const meter=document.createElement('div');meter.className='comparison-meter';const bar=document.createElement('div');bar.className='comparison-bar';bar.style.width=`${numericCount/tacticMaximum*100}%`;meter.append(bar);const value=document.createElement('span');value.className='comparison-value';value.textContent=`${numericCount} (${(numericCount/(gameCount||1)).toFixed(2)}/試合)`;row.append(name,meter,value);return row;})); results.hidden=gameCount===0; feedback.className='success';feedback.textContent=gameCount===0?'試合結果はありません。':`試合終了：${gameCount}試合`; }
  function shareText() { return `打順監督の結果\\n平均得点: ${document.querySelector('#average-score').textContent}\\n中央値得点: ${document.querySelector('#median-score').textContent}\\n最大得点: ${document.querySelector('#maximum-score').textContent}`; }
  shareResults.addEventListener('click',async()=>{const text=shareText();try {if (navigator.share) { await navigator.share({title:'打順監督の結果',text}); feedback.className='success';feedback.textContent='結果を共有しました。'; } else { await navigator.clipboard.writeText(text); feedback.className='success';feedback.textContent='共有用テキストをコピーしました。'; }} catch (error) { if (error.name !== 'AbortError') { feedback.className='error';feedback.textContent='共有できませんでした。'; } }});
  toggleAllBunt.addEventListener('click',()=>{const enabled=!lineup.every(player=>player.buntEnabled);lineup.forEach(player=>{player.buntEnabled=enabled;});render();});
  toggleAllSteal.addEventListener('click',()=>{const enabled=!lineup.every(player=>player.stealEnabled);lineup.forEach(player=>{player.stealEnabled=enabled;});render();});
  submit.addEventListener('click',async()=>{if(inFlight||!lineup.every(valid))return; inFlight=true;render();results.hidden=true;feedback.textContent='シミュレーション中…';try {const response=await fetch('/simulations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lineup.map(player=>({hit_average:Number(player.hitAverage),sluggish:Number(player.sluggish),bunt_success_rate:Number(player.buntSuccessRate),steal_success_rate:Number(player.stealSuccessRate),bunt_enabled:player.buntEnabled,steal_enabled:player.stealEnabled})))});const data=await response.json();if(!response.ok)throw new Error(data.error||data.message||'リクエストに失敗しました。');renderResults(data.statistics);}catch(error){feedback.className='error';feedback.textContent=error.message;}finally{inFlight=false;render();}});
  render();
</script>
</body>
</html>
