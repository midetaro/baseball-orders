<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batting Order Lab</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f3e8; --muted:#a8b0ad; --panel:#17201f; --line:#31423e; --lime:#d8ff62; --orange:#ff8d5c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 80% 0,#27413a 0,transparent 32rem),#0c1212; font-family:Inter,"Noto Sans JP",sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.06; background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px); background-size:32px 32px; }
    main { width:min(1180px,calc(100% - 32px)); margin:auto; padding:48px 0 64px; position:relative; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:34px; }
    .eyebrow { color:var(--lime); font:700 12px/1 monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:10px 0 0; font-size:clamp(36px,6vw,72px); letter-spacing:-.06em; line-height:.9; }
    .status { color:var(--muted); font-size:13px; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    section { min-width:0; background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 24px 70px #0006; }
    .section-head { padding:22px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    h2 { margin:0; font-size:18px; }
    .count { color:var(--muted); font:12px monospace; }
    .players { padding:12px; display:grid; gap:8px; }
    .player { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; padding:14px; background:#101817; border:1px solid transparent; border-radius:12px; }
    .player:hover { border-color:#526a64; }
    .number { color:var(--lime); font:700 13px monospace; }
    .name { font-weight:700; }
    .stats { color:var(--muted); font:11px monospace; margin-top:5px; }
    button { border:0; cursor:pointer; font:700 13px inherit; }
    .add { width:34px; height:34px; border-radius:50%; background:var(--lime); color:#15200d; font-size:20px; }
    .order-scroll { overflow-x:auto; }
    .order { padding:0 12px 12px; min-height:420px; min-width:490px; }
    .slot { display:grid; grid-template-columns:24px minmax(80px,1fr) 48px 48px 72px 94px; align-items:center; gap:8px; min-height:48px; padding:8px 10px; border-bottom:1px solid var(--line); }
    .slot-name { min-width:0; overflow-wrap:anywhere; }
    .slot-stat { text-align:right; color:var(--muted); font:12px monospace; font-variant-numeric:tabular-nums; }
    .order-columns { margin:0 12px; min-width:466px; color:var(--muted); font-size:11px; }
    .order-columns .column-stat { text-align:right; }
    .slot-index { color:var(--orange); font:700 13px monospace; }
    .slot.empty .slot-name { color:#68736f; font-weight:400; }
    .controls { display:flex; gap:5px; }
    .move,.remove { background:#263431; color:var(--ink); border-radius:7px; width:28px; height:28px; }
    .remove { color:#ff9a87; }
    .actions { padding:18px 24px 24px; border-top:1px solid var(--line); }
    .submit { width:100%; padding:16px; border-radius:10px; background:var(--lime); color:#17200f; letter-spacing:.05em; }
    button:disabled { opacity:.35; cursor:not-allowed; }
    #feedback { min-height:56px; margin-top:12px; padding:13px; border-radius:10px; background:#101817; color:var(--muted); white-space:pre-line; }
    #feedback.success { color:var(--lime); }
    #feedback.error { color:#ff9a87; }
    #results { margin-top:22px; }
    .statistics { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); }
    .statistic { padding:18px 24px; border-right:1px solid var(--line); }
    .statistic:last-child { border-right:0; }
    .statistic-label { color:var(--muted); font-size:11px; }
    .statistic-value { margin-top:6px; font:700 26px monospace; color:var(--lime); }
    .results-scroll { overflow-x:auto; }
    .results-table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    .results-table th,.results-table td { padding:12px 24px; text-align:right; border-bottom:1px solid var(--line); }
    .results-table th { color:var(--muted); }
    .results-table th:first-child,.results-table td:first-child { text-align:left; }
    @media (max-width:780px) { header { align-items:start; flex-direction:column; } .layout { grid-template-columns:1fr; } main { padding-top:30px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Baseball Orders / Simulator</div><h1>LINEUP<br>BUILDER</h1></div>
    <div class="status">9人を選び、勝負の打順を組み立てる。</div>
  </header>
  <div class="layout">
    <section aria-labelledby="players-heading">
      <div class="section-head"><h2 id="players-heading">打者一覧</h2><span class="count" th:text="${#lists.size(players)} + ' PLAYERS'">0 PLAYERS</span></div>
      <div class="players" id="players">
        <article class="player" th:each="player : ${players}" th:attr="data-id=${player.playerId},data-name=${player.name},data-hit-average=${#numbers.formatDecimal(player.hitAverage, 1, 3)},data-sluggish=${#numbers.formatDecimal(player.sluggish, 1, 3)},data-steal-success-rate=${#numbers.formatPercent(player.stealSuccessRate, 1, 0)}">
          <span class="number" th:text="'#' + ${player.playerId}">#1</span>
          <div><div class="name" th:text="${player.name}">Player</div><div class="stats" th:text="'AVG ' + ${#numbers.formatDecimal(player.hitAverage, 1, 3)} + ' / SLG ' + ${#numbers.formatDecimal(player.sluggish, 1, 3)} + ' / BUNT ' + ${#numbers.formatPercent(player.buntSuccessRate, 1, 0)}">AVG</div></div>
          <button class="add" type="button" aria-label="打順に追加">+</button>
        </article>
      </div>
    </section>
    <section aria-labelledby="order-heading">
      <div class="section-head"><h2 id="order-heading">打順</h2><span class="count"><strong id="selected-count">0</strong> / 9</span></div>
      <div class="order-scroll" tabindex="0" aria-label="打順と打撃成績">
        <div class="slot order-columns"><span>打順</span><span>選手名</span><span class="column-stat">打率</span><span class="column-stat">長打率</span><span class="column-stat">盗塁成功率</span><span></span></div>
        <div class="order" id="order"></div>
      </div>
      <div class="actions"><button class="submit" id="submit" type="button" disabled>SIMULATIONを実行</button><div id="feedback" role="status">9人の打者を選択してください。</div></div>
    </section>
  </div>
  <section id="results" aria-labelledby="results-heading" hidden>
    <div class="section-head"><h2 id="results-heading">試合結果</h2></div>
    <div class="statistics" aria-label="得点統計">
      <div class="statistic"><div class="statistic-label">平均得点</div><div class="statistic-value" id="average-score"></div></div>
      <div class="statistic"><div class="statistic-label">中央値得点</div><div class="statistic-value" id="median-score"></div></div>
      <div class="statistic"><div class="statistic-label">最大得点</div><div class="statistic-value" id="maximum-score"></div></div>
    </div>
    <div class="results-scroll" tabindex="0" aria-label="全試合の得点と失点">
      <table class="results-table" aria-labelledby="results-heading">
        <thead><tr><th scope="col">試合</th><th scope="col">得点</th><th scope="col">失点</th></tr></thead>
        <tbody id="result-rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const lineup = [];
  let inFlight = false;
  const order = document.querySelector('#order');
  const submit = document.querySelector('#submit');
  const feedback = document.querySelector('#feedback');
  const results = document.querySelector('#results');
  const resultRows = document.querySelector('#result-rows');
  const averageScore = document.querySelector('#average-score');
  const medianScore = document.querySelector('#median-score');
  const maximumScore = document.querySelector('#maximum-score');
  document.querySelectorAll('.player').forEach(card => card.querySelector('.add').addEventListener('click', () => {
    if (inFlight || lineup.length === 9 || lineup.some(player => player.id === card.dataset.id)) return;
    lineup.push({ id: card.dataset.id, name: card.dataset.name, hitAverage: card.dataset.hitAverage, sluggish: card.dataset.sluggish, stealSuccessRate: card.dataset.stealSuccessRate }); render();
  }));
  function render() {
    order.replaceChildren();
    for (let index = 0; index < 9; index++) {
      const player = lineup[index]; const row = document.createElement('div'); row.className = `slot ${player ? '' : 'empty'}`;
      const position = document.createElement('span'); position.className = 'slot-index'; position.textContent = index + 1;
      const name = document.createElement('strong'); name.className = 'slot-name'; name.textContent = player ? player.name : '打者を選択';
      row.append(position, name);
      ['hitAverage', 'sluggish', 'stealSuccessRate'].forEach(key => {
        const stat = document.createElement('span'); stat.className = 'slot-stat'; stat.textContent = player ? player[key] : '—'; row.append(stat);
      });
      const controls = document.createElement('div'); controls.className = 'controls';
      if (player) [{label:'↑',delta:-1,title:'上へ'},{label:'↓',delta:1,title:'下へ'},{label:'×',delta:0,title:'削除'}].forEach(control => { const button=document.createElement('button'); button.type='button'; button.className=control.delta===0?'remove':'move'; button.textContent=control.label; button.title=control.title; button.addEventListener('click',()=>{ if(inFlight) return; if(control.delta===0) lineup.splice(index,1); else { const next=index+control.delta; if(next>=0&&next<lineup.length) { const current=lineup[index]; lineup[index]=lineup[next]; lineup[next]=current; } } render(); }); controls.append(button); });
      row.append(controls); order.append(row);
    }
    document.querySelector('#selected-count').textContent = lineup.length; submit.disabled = inFlight || lineup.length !== 9;
    feedback.className=''; feedback.textContent = lineup.length === 9 ? '準備完了。シミュレーションを実行できます。' : `${9-lineup.length}人を追加してください。`;
  }
  function renderResults(games, statistics) {
    averageScore.textContent = String(statistics.averageScore);
    medianScore.textContent = String(statistics.medianScore);
    maximumScore.textContent = String(statistics.maximumScore);
    games.forEach((game, index) => {
      const row = document.createElement('tr');
      [index + 1, game.score, game.runs].forEach(value => {
        const cell = document.createElement('td');
        cell.textContent = String(value);
        row.append(cell);
      });
      resultRows.append(row);
    });
    results.hidden = games.length === 0;
    feedback.className = 'success';
    feedback.textContent = games.length === 0 ? '試合結果はありません。' : `試合終了：${games.length}試合`;
  }
  function setInFlight(value) {
    inFlight = value;
    submit.disabled = value || lineup.length !== 9;
    document.querySelectorAll('.add, .move, .remove').forEach(button => { button.disabled = value; });
    feedback.setAttribute('aria-busy', String(value));
  }
  submit.addEventListener('click', async () => {
    if (inFlight || lineup.length !== 9) return;
    resultRows.replaceChildren(); results.hidden = true;
    setInFlight(true); feedback.className=''; feedback.textContent='シミュレーション中…';
    try { const response=await fetch('/simulations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lineup.map(player=>({player_id:Number(player.id)})))}); const data=await response.json(); if(!response.ok) throw new Error(data.error||data.message||'リクエストに失敗しました。'); renderResults(data.results, data.statistics); }
    catch(error) { feedback.className='error'; feedback.textContent=error.message; }
    finally { setInFlight(false); }
  });
  render();
</script>
</body>
</html>
