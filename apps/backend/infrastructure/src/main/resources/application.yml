spring:
  profiles:
    default: local
  application:
    name: baseball-orders-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:baseball-orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

baseball-orders:
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
spring.cloud.aws:
  region:
    static: ap-northeast-1

simulation:
  sqs:
    request-queue-name: ${SIMULATION_REQUEST_QUEUE_NAME:simulation-request}
    result-queue-name: ${SIMULATION_RESULT_QUEUE_NAME:simulation-result}

logging:
  level:
    com.example.baseballorders.backend: INFO
