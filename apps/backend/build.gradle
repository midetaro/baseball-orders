plugins {
    id 'com.diffplug.spotless' version '8.2.1' apply false
}

allprojects {
    group = 'com.example.baseballorders.backend'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    spotless {
        java {
            googleJavaFormat('1.28.0').aosp()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    plugins.withType(JavaPlugin).configureEach {
        dependencies {
            compileOnly 'cc.jilt:jilt:1.9.1'
            annotationProcessor 'cc.jilt:jilt:1.9.1'
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            dependsOn(tasks.named('spotlessCheck'))
        }
    }
}

tasks.register('build') {
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('build') }
}

tasks.register('clean') {
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('clean') }
}
