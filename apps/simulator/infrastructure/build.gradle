plugins {
    id 'java-library'
    id 'jacoco'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':application')
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.springframework:spring-context:7.0.1'
    implementation 'io.grpc:grpc-netty-shaded:1.85.1'

    compileOnly 'org.projectlombok:lombok:1.18.42'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation testFixtures(project(':domain'))
    testImplementation project(':domain')
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'io.grpc:grpc-inprocess:1.85.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            includes = [
                    'com.example.baseballorders.simulator.infrastructure.messaging.GrpcSimulationService'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}
