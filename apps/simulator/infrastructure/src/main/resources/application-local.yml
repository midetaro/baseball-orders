simulation:
  game-count: 100
  sqs:
    max-messages-per-poll: 10
    long-poll-seconds: 10
    poll-fixed-delay: ${SIMULATION_SQS_POLL_FIXED_DELAY:60s}
  rule:
    batting:
      walk-probability: 0.05
      strikeout-probability-when-not-on-base: 0.25
    short-distance-hitting:
      single-weight: 3
      double-weight: 2
      triple-weight: 0
      home-run-weight: 0
    middle-distance-hitting:
      single-weight: 15
      double-weight: 1
      triple-weight: 1
      home-run-weight: 1
    long-distance-hitting:
      single-weight: 16
      double-weight: 1
      triple-weight: 1
      home-run-weight: 4
    high-on-base-batting:
      walk-probability: 0.1
    standard-steal:
      to-double-attempt-rate: 0.30
      to-triple-attempt-rate: 0.10
    eager-steal:
      to-double-attempt-rate: 0.3
      to-triple-attempt-rate: 0.15
    runner-advance:
      from-first-probability: 0.2
      from-second-probability: 0.2
      from-third-probability: 0.1
    steal-success-rate: 0.70
    bunt:
      advancing-success-rate: 0.81
      squeeze-success-rate: 0.45
      squeeze-challenge-rate: 0.25
  pitcher:
    standard:
      on-base-multiplier: 1.0
