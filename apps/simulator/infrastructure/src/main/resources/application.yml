simulation:
  game-count: ${SIMULATION_GAME_COUNT:100}
  sqs:
    max-messages-per-poll: ${SIMULATION_SQS_MAX_MESSAGES_PER_POLL:10}
    long-poll-seconds: ${SIMULATION_SQS_LONG_POLL_SECONDS:10}
    poll-fixed-delay: ${SIMULATION_SQS_POLL_FIXED_DELAY:60s}
    request-queue-name: ${SIMULATION_REQUEST_QUEUE_NAME:simulation-request}
    result-queue-name: ${SIMULATION_RESULT_QUEUE_NAME:simulation-result}
  rule:
    batting:
      walk-probability: ${SIMULATION_RULE_WALK_PROBABILITY:0.05}
      strikeout-probability-when-not-on-base: ${SIMULATION_RULE_STRIKEOUT_PROBABILITY:0.25}
    short-distance-hitting:
      single-weight: ${SIMULATION_RULE_SHORT_SINGLE_WEIGHT:3}
      double-weight: ${SIMULATION_RULE_SHORT_DOUBLE_WEIGHT:2}
      triple-weight: ${SIMULATION_RULE_SHORT_TRIPLE_WEIGHT:0}
      home-run-weight: ${SIMULATION_RULE_SHORT_HOME_RUN_WEIGHT:0}
    middle-distance-hitting:
      single-weight: ${SIMULATION_RULE_MIDDLE_SINGLE_WEIGHT:15}
      double-weight: ${SIMULATION_RULE_MIDDLE_DOUBLE_WEIGHT:1}
      triple-weight: ${SIMULATION_RULE_MIDDLE_TRIPLE_WEIGHT:1}
      home-run-weight: ${SIMULATION_RULE_MIDDLE_HOME_RUN_WEIGHT:1}
    long-distance-hitting:
      single-weight: ${SIMULATION_RULE_LONG_SINGLE_WEIGHT:16}
      double-weight: ${SIMULATION_RULE_LONG_DOUBLE_WEIGHT:1}
      triple-weight: ${SIMULATION_RULE_LONG_TRIPLE_WEIGHT:1}
      home-run-weight: ${SIMULATION_RULE_LONG_HOME_RUN_WEIGHT:4}
    high-on-base-batting:
      walk-probability: ${SIMULATION_RULE_HIGH_ON_BASE_WALK_PROBABILITY:0.1}
    standard-steal:
      to-double-attempt-rate: ${SIMULATION_RULE_STANDARD_STEAL_TO_DOUBLE_RATE:0.30}
      to-triple-attempt-rate: ${SIMULATION_RULE_STANDARD_STEAL_TO_TRIPLE_RATE:0.10}
    eager-steal:
      to-double-attempt-rate: ${SIMULATION_RULE_EAGER_STEAL_TO_DOUBLE_RATE:0.3}
      to-triple-attempt-rate: ${SIMULATION_RULE_EAGER_STEAL_TO_TRIPLE_RATE:0.15}
    runner-advance:
      from-first-probability: ${SIMULATION_RULE_ADVANCE_FROM_FIRST_PROBABILITY:0.2}
      from-second-probability: ${SIMULATION_RULE_ADVANCE_FROM_SECOND_PROBABILITY:0.2}
      from-third-probability: ${SIMULATION_RULE_ADVANCE_FROM_THIRD_PROBABILITY:0.1}
    steal-success-rate: ${SIMULATION_RULE_STEAL_SUCCESS_RATE:0.70}
    bunt:
      advancing-success-rate: ${SIMULATION_RULE_BUNT_ADVANCING_SUCCESS_RATE:0.81}
      squeeze-success-rate: ${SIMULATION_RULE_BUNT_SQUEEZE_SUCCESS_RATE:0.45}
      squeeze-challenge-rate: ${SIMULATION_RULE_BUNT_SQUEEZE_CHALLENGE_RATE:0.25}
  pitcher:
    standard:
      on-base-multiplier: ${SIMULATION_PITCHER_STANDARD_ON_BASE_MULTIPLIER:1.0}
