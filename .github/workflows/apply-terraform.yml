name: Apply AWS Terraform

on:
  push:
    branches:
      - develop
    paths:
      - "infra/aws-terraform/**"
      - ".github/workflows/apply-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-develop
  cancel-in-progress: false

jobs:
  apply:
    name: Plan and apply AWS infrastructure
    runs-on: ubuntu-latest
    environment: aws-development
    defaults:
      run:
        working-directory: infra/aws-terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY || 'baseball-orders/develop/terraform.tfstate' }}"
          -backend-config="region=${{ vars.AWS_REGION || 'ap-northeast-1' }}"
          -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Create execution plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply execution plan
        run: terraform apply -input=false -auto-approve tfplan
