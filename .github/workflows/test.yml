name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.application }}
    runs-on: ubuntu-latest
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.16
        ports:
          - 9324:9324
    strategy:
      fail-fast: false
      matrix:
        application:
          - backend
          - simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all tests
        working-directory: apps/${{ matrix.application }}
        env:
          SQS_ENDPOINT: ${{ matrix.application == 'backend' && 'http://localhost:9324' || '' }}
        run: ./gradlew --no-daemon :domain:test :application:test :infrastructure:test
