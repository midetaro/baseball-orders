name: Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Test Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # main.tftest.hcl and friends use override_resource's override_during
          # argument, added in Terraform 1.11.0. terraform init/plan/apply also
          # parse .tftest.hcl files in the working directory, so deploy.yml and
          # plan-terraform-deployment.yml must use this same version.
          terraform_version: "1.14.5"

      - name: Run Terraform checks
        run: ./.agents/skills/baseball-orders-development/scripts/verify.sh terraform

  test:
    name: Test ${{ matrix.application }}
    runs-on: ubuntu-latest
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.16
        ports:
          - 9324:9324
    strategy:
      fail-fast: false
      matrix:
        application:
          - backend
          - simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all tests
        env:
          SQS_ENDPOINT: ${{ matrix.application == 'backend' && 'http://localhost:9324' || '' }}
          ELASTICMQ_ENDPOINT_URL: ${{ matrix.application == 'simulator' && 'http://localhost:9324' || '' }}
        run: ./.agents/skills/baseball-orders-development/scripts/verify.sh ${{ matrix.application }}
